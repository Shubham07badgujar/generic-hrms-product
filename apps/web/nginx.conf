# Serves the built SPA and puts the API on the same origin.
#
# Same-origin matters here: the refresh token lives in a SameSite=Strict
# cookie. Served from a different host to the API, the browser would decline to
# send it and every session would end at the first token refresh. Routing
# /api/v1 through this server keeps the SPA and the API on one origin, which
# also means no CORS preflight on any request.
#
# TLS, HSTS and compression are the shared Caddy's job; duplicating them here
# would mean two places to change one policy.

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Needed because nginx resolves an `upstream` block
    # ONCE at start-up: recreate the api container, it gets a new IP, and nginx
    # keeps proxying to the old one — 502 on every request until nginx is
    # restarted too. Resolving through a variable (below) defers the lookup to
    # request time, so a redeploy of the API no longer takes the SPA down with
    # it.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads can be large; the default 1 MB would reject a scanned document.
    client_max_body_size 25m;

    # ---- API ----------------------------------------------------------
    location /api/ {
        # The CONTAINER name, not the compose service name.
        #
        # `api` is only unambiguous inside this project's own network. Caddy
        # lives on a shared network, so reaching it means this container joins
        # that network too — and there, `api` is already an alias belonging to
        # an unrelated application. Requests went to that one instead of ours.
        # It surfaced as a 502 only because that container happens to listen on
        # a different port; had it listened on 8000, HRMS traffic would have
        # been quietly answered by someone else's service.
        #
        # `hrmsv2-api-1` is unique across the whole host, so it cannot collide
        # with a neighbour whatever networks this container joins.
        #
        # Still a variable, so it resolves per request rather than being cached
        # at start-up and going stale on redeploy. $request_uri is required
        # because proxy_pass with a variable does not append the matched path.
        set $api_upstream http://hrmsv2-api-1:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Django reads this to know the original request was HTTPS. Without it
        # SECURE_SSL_REDIRECT would see http and redirect forever.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # A payroll run over a few hundred employees takes longer than the
        # 60s default, and a truncated response mid-run is worse than a wait.
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Django's own static files — DRF's browsable API and the admin.
    location /static/ {
        set $static_upstream http://hrmsv2-api-1:8000;
        proxy_pass $static_upstream$request_uri;
        proxy_set_header Host $host;
        expires 1h;
    }

    # ---- SPA ----------------------------------------------------------
    # Hashed bundle filenames, so they can be cached indefinitely. The
    # directory is deliberately NOT Vite's default "assets": the app has a
    # real /assets route (the asset register), and a same-named folder here
    # shadowed it — /assets was redirected into the directory and 404'd.
    location /bundles/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached: it names the current asset hashes, and a
    # stale copy points the browser at bundles that no longer exist — the
    # classic "white screen after deploy".
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Client-side routing: unknown paths belong to React Router, not to a 404.
    # No `$uri/` step: a stray directory matching an app route would trigger
    # nginx's trailing-slash redirect instead of rendering the SPA — exactly
    # the /assets bug this file once had.
    location / {
        try_files $uri /index.html;
    }

    access_log off;
}
