# HRMS v2 — its own compose project.
#
# THIS FILE IS NOT /opt/hrms/deploy/docker-compose.yml.
#
# That other file belongs to the `deploy` project, which owns the shared Caddy
# that terminates TLS for roughly ten unrelated domains. Overwriting it took
# seven production sites down on 2026-08-11. This stack is deliberately a
# separate project, in a separate directory, with its own network and its own
# database — it shares exactly one thing with the rest of the host, and that is
# a single hand-added route block in the shared Caddyfile.
#
#   docker compose -p hrmsv2 -f deploy/docker-compose.yml up -d
#
# Nothing here publishes a port to 0.0.0.0. The web container binds to
# 127.0.0.1 only, so the stack is unreachable from the internet until Caddy is
# pointed at it — which makes the routing change the last step and a reversible
# one.

name: hrmsv2

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      # Deterministic collation. Left to the host locale, an index built on one
      # machine can sort differently on another.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    volumes:
      - hrmsv2_db:/var/lib/postgresql/data
    networks: [hrmsv2]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 10s
      timeout: 5s
      retries: 6
    # The box runs ~25 containers on 8 GB. Unbounded Postgres shared buffers
    # here would be taken from someone else's service.
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [hrmsv2]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192M

  # One-shot: make the uploads volume writable by the application user.
  #
  # The API image runs as uid 10001 and never as root, which is right — but a
  # named volume comes up owned by root, so the app could not write a single
  # uploaded document. It failed as a bare "Permission denied" the first time
  # anything tried to store a file, which is a poor way to discover that every
  # employee document, letter and payslip PDF would have been lost.
  #
  # Declared as a service rather than fixed by hand, so a fresh deployment on
  # a new host does not rediscover it.
  media-init:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 10001:999 /var/lib/hrms/media && chmod 750 /var/lib/hrms/media"]
    volumes:
      - hrmsv2_media:/var/lib/hrms/media
    restart: "no"
    networks: [hrmsv2]

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: hrmsv2-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      # Uploads. A named volume rather than a container path — without this,
      # every employee document would vanish on the next deploy.
      - hrmsv2_media:/var/lib/hrms/media
      # Secrets that must never be in the image or in .env: the Google OAuth
      # client and the one-time user grant for Google Forms. Read-only; owned
      # by the container user (uid 10001) on the host, mode 400.
      - /opt/hrms-v2/secrets:/run/secrets/hrms:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      media-init: {condition: service_completed_successfully}
    networks: [hrmsv2]
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: hrmsv2-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      - hrmsv2_media:/var/lib/hrms/media
      # Secrets that must never be in the image or in .env: the Google OAuth
      # client and the one-time user grant for Google Forms. Read-only; owned
      # by the container user (uid 10001) on the host, mode 400.
      - /opt/hrms-v2/secrets:/run/secrets/hrms:ro
    # Skips migrate/collectstatic — the api service owns those. Two containers
    # racing to migrate the same database is how you get a half-applied schema.
    entrypoint: ["celery"]
    command: ["-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    # Overrides the image's HTTP probe. These containers run Celery, not
    # gunicorn — there is no :8000 to curl, so the inherited healthcheck could
    # only ever report unhealthy and would train everyone to ignore the column.
    healthcheck:
      # CMD-SHELL, not CMD: the exec form runs without a shell, so $$HOSTNAME
      # was passed to celery as a literal string and no node ever matched it.
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME >/dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [hrmsv2]
    deploy:
      resources:
        limits:
          memory: 512M

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: hrmsv2-api:latest
    restart: unless-stopped
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hrms}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
    volumes:
      # Secrets that must never be in the image or in .env: the Google OAuth
      # client and the one-time user grant for Google Forms. Read-only; owned
      # by the container user (uid 10001) on the host, mode 400.
      - /opt/hrms-v2/secrets:/run/secrets/hrms:ro
    entrypoint: ["celery"]
    command: ["-A", "config", "beat", "--loglevel=info",
              "--scheduler", "django_celery_beat.schedulers:DatabaseScheduler"]
    # NO healthcheck, deliberately.
    #
    # Beat answers no ping — it only publishes — and the slim image has no
    # pgrep, which is how the first attempt here failed. What remains is a
    # check that could only ever assert "the process is running", and Docker
    # already knows that: beat is PID 1, so if it dies the container dies and
    # `restart: unless-stopped` brings it back.
    #
    # A probe that cannot fail for any real reason is worse than none — it
    # shows green while telling you nothing, and teaches people to trust it.
    #
    # Must be DISABLED explicitly rather than omitted: omitting it inherits the
    # image's HTTP probe, which beat cannot satisfy, so the container sits
    # permanently unhealthy.
    healthcheck:
      disable: true
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [hrmsv2]
    deploy:
      resources:
        limits:
          memory: 256M

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    image: hrmsv2-web:latest
    restart: unless-stopped
    # 127.0.0.1 ONLY. Not reachable from outside the host until the shared
    # Caddy is pointed at it, so the stack can be verified in place before it
    # is exposed.
    ports:
      - "127.0.0.1:8091:80"
    depends_on: [api]
    # Two networks, on purpose:
    #   hrmsv2       — to reach our own API
    #   caddy_shared — so the shared Caddy can reach this container
    #
    # Declared here rather than applied with `docker network connect`, because
    # a runtime attachment is lost the moment the container is recreated. The
    # first redeploy after routing was configured took the site down with a
    # 502, and the cause looked nothing like the change that triggered it.
    networks: [hrmsv2, caddy_shared]
    deploy:
      resources:
        limits:
          memory: 128M

volumes:
  hrmsv2_db:
  hrmsv2_media:

networks:
  caddy_shared:
    # The shared proxy's network, joined as EXTERNAL — this stack never
    # creates, alters or removes it, and `docker compose down` here leaves it
    # untouched. Only `web` joins, so the API, database and Redis stay
    # unreachable from every other project on the host.
    #
    # NOTE: service names are NOT unique across a shared network. `api` on
    # this one already belongs to another application, which is why nginx
    # addresses our API by its full container name instead.
    external: true
    name: deploy_default

  hrmsv2:
    # Its own bridge. No container here can reach another project's database,
    # and nothing on the host's default network can reach this one.
    name: hrmsv2
